  sex: "Q260"
  age: "Q262"
  "age group": "Q262"
  "age_group": "Q262"
  education: "Q275"
  "education level": "Q275"
  "education_level": "Q275"
  "educational level": "Q275"
  "highest education": "Q275"
  employment: "Q279"
