  "urban vs. rural setting": "H_URBRURAL"
  country: "B_COUNTRY"
  year: "A_YEAR"
  "survey year": "A_YEAR"

# --- Sign semantics (how to interpret variable direction) ---
sign_semantics:
  Q46:
    direction: "higher_is_more_negative"
    meaning: "Larger values mean less happiness."
  Q49:
    direction: "higher_is_more_positive"
    meaning: "Larger values mean greater life satisfaction."
  Q50:
    direction: "higher_is_more_positive"
    meaning: "Larger values mean greater financial satisfaction."
  Q58:
    direction: "higher_is_more_negative"
    meaning: "Larger values mean less trust."
  Q62:
    direction: "higher_is_more_negative"
    meaning: "Larger values mean less trust."
  Q71:
    direction: "higher_is_more_negative"
    meaning: "Larger values mean less confidence."
  B_COUNTRY:
    direction: "coded"
    meaning: "ISO numeric country code. Not a magnitude."
  B_COUNTRY_ALPHA:
    direction: "coded"
    meaning: "ISO alpha country code. Not a magnitude."
  A_YEAR:
    direction: "coded"
    meaning: "Calendar year of the survey wave."
  sampling_weight:
    direction: "weight"
    meaning: "Survey sampling weight."
  PWGHT:
    direction: "weight"
    meaning: "Post-stratification weight."
  W_WEIGHT:
    direction: "weight"
    meaning: "Design weight."

# --- Phase 1 persona and wording ---
phase1_persona: "You are a social scientist proposing a research idea for a cross-national survey dataset (e.g., World Values Survey)."
phase1_wording_hint: "Use codebook-like wording (confidence in..., satisfaction with..., justifiable..., trust in..., identity, belonging, corruption, inequality)."

# --- DSL rules for Phase 2 prompt ---
dsl_rules:
  - "WVS rule: assume negative/special codes (e.g., -1/-2/-4/-5) are recoded to missing before analysis."
  - "Weight columns (e.g., sampling_weight, PWGHT, W_WEIGHT) may be used only as statistical weights, NOT as main predictors/outcomes."
  - "Country/ID columns (e.g., B_COUNTRY, survey_id) may be used for stratification/grouping (by=..., | ...) or fixed effects, NOT as numeric predictors/outcomes in assoc()."
  - "survey_id is a technical identifier; do NOT use it as predictor, outcome, or control."
  - "SAME-BATTERY RULE: Do NOT test assoc() between variables from the same questionnaire section (adjacent Q-numbers like Q113 and Q114). Their correlation is trivially high by survey design."
  - "COUNTRY-DIFF RULE: diff(Y, by=B_COUNTRY) MUST include at least one substantive (non-demographic) Q-variable as a control."
  - "Do NOT put weight columns in 'controlling for'; if a weight is needed, add weights=<weight_column> at the end."
  - "CROSS-MODULE: X and Y MUST come from different WVS questionnaire sections. Connecting distant themes is far more valuable than testing within-section patterns."
  - "Simple associations (assoc, diff) are encouraged — they build the knowledge foundation. Use interact() or heterogeneity() only when you have a clear theoretical reason for a moderator."

