# Dataset profile: World Values Survey (Wave 7)

name: "wvs"
domain_description: "Cross-national public opinion survey (World Values Survey)"

# --- Flow control ---
use_two_phase: true
use_dsl: true
catalog_path: "./data/processed/wvs/wvs7_variable_catalog.jsonl"

# --- Goals ---
goals:
  primary: "Understand relationships between trust, well-being, and political attitudes across countries"
  secondary:
    - "social capital and institutional trust"
    - "value change and postmaterialism"
    - "cross-national differences in political culture"

# --- Data ---
data_path: "./data/wvs7_autokd.csv"
memory_path: "./data/memory_wvs/insight_graph.json"

weight_columns:
  - "sampling_weight"
  - "W_WEIGHT"
  - "PWGHT"

control_only_columns:
  - "FW_START"
  - "FW_END"
  - "A_YEAR"

id_columns:
  - "survey_id"
  - "B_COUNTRY"
  - "B_COUNTRY_ALPHA"

text_columns: []

known_categorical:
  - "B_COUNTRY"
  - "B_COUNTRY_ALPHA"
  - "H_URBRURAL"
  - "country"
  - "country_code"

nlp_features: []

# --- Missing codes ---
# WVS uses negative codes for missing/not-asked/refused
missing_codes: [-1, -2, -3, -4, -5]

# --- Derived / tautological column pairs ---
# Pairs of columns where one is mechanically derived from the other.
# Hypotheses testing these pairs are rejected as tautological.  This
# blocks trivial findings like "Age differs across groups defined by
# Age recoded (3 intervals)" from consuming slots in the insight graph.
derived_pairs:
  # Age: Q262 is the raw value; X003R is age-recoded-6-intervals;
  # X003R2 is age-recoded-3-intervals.  All three measure the same
  # underlying age variable.
  - [Q262, X003R]
  - [Q262, X003R2]
  - [X003R, X003R2]
  # Education: Q275 is ISCED 0-8; Q275R is recoded-to-3-groups.
  - [Q275, Q275R]

# --- Column labels (human-friendly names for evaluator rendering) ---
column_labels:
  B_COUNTRY: "country"
  B_COUNTRY_ALPHA: "country"
  A_YEAR: "survey year"
  year: "survey year"
  H_URBRURAL: "urban vs rural residence"
  FW_START: "fieldwork start date"
  FW_END: "fieldwork end date"
  survey_id: "survey (wave) id"
  sampling_weight: "survey weights"
  PWGHT: "survey weights"
  W_WEIGHT: "survey weights"

# --- Demographic synonyms (natural language -> column name) ---
