# --- Sign semantics ---
# Direction metadata for columns with non-obvious or important scale semantics.
# Used by DSL executor for interpretation flags and by critic for audit context.
sign_semantics:
  disruption:
    direction: "bipolar"
    meaning: "Ranges from -1 (consolidating: citing papers also cite this paper's references) to +1 (disruptive: citing papers ignore this paper's references). Zero is neutral."
  Atyp_Median_Z:
    direction: "higher_is_more_positive"
    meaning: "Higher values indicate more atypical/novel combinations of cited journals relative to random expectation."
  Atyp_10pct_Z:
    direction: "higher_is_more_negative"
    meaning: "Lower values indicate the paper has at least one very conventional journal pair grounding its references. High novelty papers often have LOW Atyp_10pct_Z (conventional anchor) paired with HIGH Atyp_Median_Z (overall novelty)."
  normalized_citation:
    direction: "higher_is_more_positive"
    meaning: "Field-and-year normalized citation score. 1.0 = average for field and year; >1 means above average; <1 below average."
  citation_velocity:
    direction: "higher_is_more_positive"
    meaning: "Higher values indicate faster citation accumulation per year."
  WSB_mu:
    direction: "higher_is_more_negative"
    meaning: "Higher mu indicates longer dormancy before the citation burst (later awakening). A sleeping beauty has high mu."
  WSB_sigma:
    direction: "neutral"
    meaning: "Width of the citation burst. Larger sigma means a more spread-out (less sharp) burst of attention."
  SB_B:
    direction: "higher_is_more_positive"
    meaning: "Higher B indicates a more pronounced sleeping beauty pattern (stronger delayed recognition)."
  first_author_gender_prob_female:
    direction: "probability"
    meaning: "Probability that the first author is female, inferred from name. 0 = likely male, 1 = likely female. NaN when inference is not possible (e.g., initials only)."
  last_author_gender_prob_female:
    direction: "probability"
    meaning: "Probability that the last author is female, inferred from name. 0 = likely male, 1 = likely female."
  primary_field_score:
    direction: "higher_is_more_positive"
    meaning: "OpenAlex confidence score for the primary field classification. Higher = more confident assignment."
  mean_ref_age:
    direction: "higher_is_more_positive"
    meaning: "Higher values indicate the paper draws on older, potentially more foundational literature."
  pct_recent_refs_5yr:
    direction: "higher_is_more_positive"
    meaning: "Higher values indicate a more current bibliography, drawing heavily on recent work."
  pct_old_refs_20yr:
    direction: "higher_is_more_positive"
    meaning: "Higher values indicate the paper draws heavily on classic, foundational work (20+ years old)."
  normalized_citation_l1:
    direction: "higher_is_more_positive"
    meaning: "Subfield-and-year normalized citation score. 1.0 = average for subfield and year; >1 means above average."

# --- Prompt hints ---
prompt_hints:
  - "SciSciNet variables are scientometric measures. Prefer log-transformed citation variables (log_citation_count, log_C5, etc.) over raw counts for assoc() and interact()."
  - "paperid is a unique identifier; never use it as a numeric predictor or outcome."
  - "No survey weights exist in this dataset."
  - "doctype and primary_field_name are categorical; use them as grouping variables (by=..., |...) not as numeric predictors."
  - "New features: Open Access (is_oa, source_is_oa), Reference Age Profile (mean_ref_age, pct_recent_refs_5yr), institution type (has_industry_collab), Nobel connections, PubMed indicator, and subfield-level citations (normalized_citation_l1). These enable new cross-module research questions."
  - "has_nobel_connection is extremely sparse (~0.04% of papers). Use it as a grouping variable or moderator, not as a predictor in regression."

# --- Phase 1 persona and wording ---
phase1_persona: "You are a Science of Science researcher proposing a research idea for a large-scale bibliometric dataset covering millions of academic papers."
phase1_wording_hint: "Use scientometric terminology (citation impact, disruption, atypicality, team size, interdisciplinarity, delayed recognition, h-index, knowledge recombination, sleeping beauty)."

# --- DSL rules for Phase 2 prompt ---
dsl_rules:
  - "This dataset has NO missing codes — all missing values are NaN, handled automatically."
  - "There are NO survey weights. Do NOT include a weights=... clause."
  - "paperid is a technical identifier — do NOT use it as predictor, outcome, or control."
  - "Categorical columns (doctype, primary_field_name, primary_country) may be used for grouping (by=..., |...) but NOT as numeric predictors in assoc()."
  - "CROSS-MODULE: X and Y MUST come from different thematic modules (e.g., Citation Impact vs Team Composition, or Novelty/Disruption vs Author Metrics). This is where surprising discoveries happen."
  - "When testing citation variables as outcomes, prefer log-transformed versions (log_citation_count, log_C5, log_C10) for better distributional properties."
  - "COMPLEX EFFECTS: At least 3 hypotheses MUST use interact() or heterogeneity() — these test WHEN and FOR WHOM effects hold."
  - "SURPRISE: At least 2 hypotheses should test a relationship most scientists would NOT expect."
  - "MODULE NAMES ARE NOT COLUMNS. These are concept menu labels, NOT column names: 'real_world_impact', 'citation_impact', 'field_and_interdisciplinarity', 'team_composition', 'author_metrics', 'sleeping_beauty', 'funding_sources'. Use exact column names from the schema."
  - "COLUMN NAME ACCURACY: Use exact column names. Common mistakes: 'disruption_index' should be 'disruption', 'SB_mu' or 'SB_Cinf' should be 'WSB_mu' or 'WSB_Cinf', 'WSB_B' should be 'SB_B', 'publication_year' should be 'year'. Do NOT invent columns."
  - "LOG VARIANTS: Only these log-transformed columns exist: log_citation_count, log_cited_by_count, log_C3, log_C5, log_C10. Do NOT invent others (log_normalized_citation, log_WSBCinf, log_paper_age, log_num_level0_fields, log_citation_velocity do NOT exist)."
  - "GROUPING AND MODERATOR VARIABLES: For diff(by=...), heterogeneity(...|G), and interact(X*Z->Y) moderator Z — the grouping/moderator variable MUST be categorical or binary. Valid choices: doctype, primary_field_name, primary_country, is_international, is_solo_author, is_hit_1pct, is_hit_5pct, is_hit_10pct, is_hit_1pct_l1, is_hit_5pct_l1, is_hit_10pct_l1, has_patent, has_news, has_clinical_trial, has_nih_funding, has_nsf_funding, is_retracted, is_oa, source_is_oa, has_license, has_nobel_connection, has_pmid, has_industry_collab, has_healthcare_collab, has_abstract, title_has_question, title_has_colon, is_english. Do NOT use continuous variables as grouping/moderator: year, paper_age, primary_field_score, disruption, citation_velocity, normalized_citation, normalized_citation_l1, any h-index, any _avg_c10, any _productivity, any _gender_prob_female, any WSB/SB metric, any Atyp metric, any count variable, mean_ref_age, median_ref_age, ref_age_std, ref_age_range, pct_recent_refs_5yr, pct_old_refs_20yr, nobel_connection_count, num_affil_types, abstract_word_count, title_word_count, title_char_count."
  - "CITATION OUTCOME DIVERSITY: Do NOT test the same predictor against multiple citation metrics. If you test X → log_C10, do NOT also test X → log_C5, X → log_citation_count, X → citation_velocity, X → normalized_citation, X → normalized_citation_l1, or X → is_hit_*pct / is_hit_*pct_l1 in the same batch. Pick ONE citation outcome per predictor. Vary the PREDICTOR across hypotheses, not the citation metric."
  - "REFERENCE AGE: mean_ref_age, median_ref_age, ref_age_std, ref_age_range, pct_recent_refs_5yr, pct_old_refs_20yr may be NULL for papers with zero references. This is NOT missing data — it means the feature is inapplicable. Do NOT impute zeros."

