# Dataset profile: SciSciNet v2 (Science of Science)
# Paper-level scientometrics dataset with citation impact, disruption,
# atypicality, team composition, author metrics, and real-world impact.

name: "sciscinet"
domain_description: >-
  Science of Science (Scientometrics / Research on Research).
  Paper-level dataset with citation metrics, novelty indices,
  team composition, author career indicators, and real-world impact
  measures derived from the SciSciNet v2 corpus.

# --- Flow control ---
use_two_phase: true
use_dsl: true
catalog_path: "./data/processed/sciscinet/sciscinet_variable_catalog.jsonl"

# --- Goals ---
goals:
  primary: "Discover factors that drive scientific impact, disruption, and innovation in computer science research"
  secondary:
    - "team composition and collaboration effects"
    - "novelty and atypicality patterns"
    - "gender disparities in science"
    - "temporal trends in scientific innovation"

# --- Data ---
data_path: "./data/sciscinet_cs_autokd.csv"
memory_path: "./data/memory_sciscinet_cs/insight_graph.json"

weight_columns: []

control_only_columns:
  - "paperid"

id_columns:
  - "paperid"

text_columns: []

known_categorical:
  - "doctype"
  - "primary_field_name"
  - "primary_country"

grouping_excluded:
  - "primary_country"

nlp_features: []

# --- Derived / tautological column pairs ---
# Pairs of columns where one is mechanically derived from the other.
# Hypotheses testing these pairs are rejected as tautological.
derived_pairs:
  # Raw count ↔ log transform
  - [citation_count, log_citation_count]
  - [cited_by_count, log_cited_by_count]
  - [C3, log_C3]
  - [C5, log_C5]
  - [C10, log_C10]
  # Nested citation windows (C3 ⊂ C5 ⊂ C10 ⊂ citation_count)
  - [C3, C5]
  - [C3, C10]
  - [C5, C10]
  - [C3, citation_count]
  - [C5, citation_count]
  - [C10, citation_count]
  - [log_C3, log_C5]
  - [log_C3, log_C10]
  - [log_C5, log_C10]
  - [log_C3, log_citation_count]
  - [log_C5, log_citation_count]
  - [log_C10, log_citation_count]
  # Redundant team-size measures
  - [team_size, team_size_derived]
  - [team_size, num_authors]
  - [team_size_derived, num_authors]
  - [team_size_derived, is_solo_author]
  - [num_authors, is_solo_author]
  # Redundant institution measures
  - [institution_count, num_institutions]
  # Count ↔ binary flag (one derived from the other)
  - [patent_count, has_patent]
  - [newsfeed_count, has_news]
  - [nct_count, has_clinical_trial]
  - [nih_count, has_nih_funding]
  - [nsf_count, has_nsf_funding]
  # Nested hit-paper flags (1% ⊂ 5% ⊂ 10%)
  - [is_hit_1pct, is_hit_5pct]
  - [is_hit_1pct, is_hit_10pct]
  - [is_hit_5pct, is_hit_10pct]
  # Citation-outcome equivalence: these all measure "citation impact" and
  # testing the same predictor against multiple of them is redundant.
  - [normalized_citation, citation_velocity]
  - [normalized_citation, is_hit_1pct]
  - [normalized_citation, is_hit_5pct]
  - [normalized_citation, is_hit_10pct]
  - [citation_velocity, is_hit_1pct]
  - [citation_velocity, is_hit_5pct]
  - [citation_velocity, is_hit_10pct]
  # cited_by_count ↔ citation_count (nearly identical in SciSciNet)
  - [citation_count, cited_by_count]
  - [log_citation_count, log_cited_by_count]
  # Hit flags ↔ ALL log citation variants (hit status is derived from citation counts)
  - [is_hit_1pct, log_cited_by_count]
  - [is_hit_5pct, log_cited_by_count]
  - [is_hit_10pct, log_cited_by_count]
  - [is_hit_1pct, log_citation_count]
  - [is_hit_5pct, log_citation_count]
  - [is_hit_10pct, log_citation_count]
  - [is_hit_1pct, log_C3]
  - [is_hit_1pct, log_C5]
  - [is_hit_1pct, log_C10]
  - [is_hit_5pct, log_C3]
  - [is_hit_5pct, log_C5]
  - [is_hit_5pct, log_C10]
  - [is_hit_10pct, log_C3]
  - [is_hit_10pct, log_C5]
  - [is_hit_10pct, log_C10]
  # normalized_citation ↔ ALL citation variants
  - [normalized_citation, citation_count]
  - [normalized_citation, cited_by_count]
  - [normalized_citation, log_citation_count]
  - [normalized_citation, log_cited_by_count]
  - [normalized_citation, log_C3]
  - [normalized_citation, log_C5]
  - [normalized_citation, log_C10]
  # citation_velocity ↔ log citation variants
  - [citation_velocity, log_citation_count]
  - [citation_velocity, log_cited_by_count]
  - [citation_velocity, log_C3]
  - [citation_velocity, log_C5]
  - [citation_velocity, log_C10]
  # log_C3/C5/C10 ↔ log_cited_by_count (all measure citation impact)
  - [log_C3, log_cited_by_count]
  - [log_C5, log_cited_by_count]
  - [log_C10, log_cited_by_count]
  # is_international is derived from num_countries (is_international = num_countries > 1)
  - [is_international, num_countries]
  # Sleeping beauty within-module pairs (WSB_mu, WSB_sigma, WSB_Cinf, SB_B, SB_T measure same construct)
  - [WSB_mu, SB_T]
  - [WSB_Cinf, SB_T]
  - [WSB_mu, WSB_Cinf]
  - [WSB_sigma, SB_T]
  - [SB_B, SB_T]
  - [WSB_Cinf, SB_B]
  - [WSB_mu, SB_B]
  - [WSB_mu, WSB_sigma]
  - [WSB_sigma, WSB_Cinf]
  - [WSB_sigma, SB_B]
  # Hit flags ↔ raw citation windows
  - [is_hit_1pct, C3]
  - [is_hit_1pct, C5]
  - [is_hit_1pct, C10]
  - [is_hit_5pct, C3]
  - [is_hit_5pct, C5]
  - [is_hit_5pct, C10]
  - [is_hit_10pct, C3]
  - [is_hit_10pct, C5]
  - [is_hit_10pct, C10]
  # Open Access within-module pairs
  - [is_oa, source_is_oa]
  - [is_oa, has_license]
  - [source_is_oa, has_license]
  # Nobel: binary derived from count
  - [has_nobel_connection, nobel_connection_count]
  # Level-1 hit flags (nested: 1% ⊂ 5% ⊂ 10%)
  - [is_hit_1pct_l1, is_hit_5pct_l1]
  - [is_hit_1pct_l1, is_hit_10pct_l1]
  - [is_hit_5pct_l1, is_hit_10pct_l1]
  # Level-1 normalized_citation ↔ level-1 hit flags
  - [normalized_citation_l1, is_hit_1pct_l1]
  - [normalized_citation_l1, is_hit_5pct_l1]
  - [normalized_citation_l1, is_hit_10pct_l1]
  # Level-0 ↔ Level-1 equivalence (same construct, different granularity)
  - [normalized_citation, normalized_citation_l1]
  - [is_hit_1pct, is_hit_1pct_l1]
  - [is_hit_5pct, is_hit_5pct_l1]
  - [is_hit_10pct, is_hit_10pct_l1]
  # Level-1 hit flags ↔ log citation variants
  - [is_hit_1pct_l1, log_citation_count]
  - [is_hit_1pct_l1, log_cited_by_count]
  - [is_hit_1pct_l1, log_C3]
  - [is_hit_1pct_l1, log_C5]
  - [is_hit_1pct_l1, log_C10]
  - [is_hit_5pct_l1, log_citation_count]
  - [is_hit_5pct_l1, log_cited_by_count]
  - [is_hit_5pct_l1, log_C3]
  - [is_hit_5pct_l1, log_C5]
  - [is_hit_5pct_l1, log_C10]
  - [is_hit_10pct_l1, log_citation_count]
  - [is_hit_10pct_l1, log_cited_by_count]
  - [is_hit_10pct_l1, log_C3]
  - [is_hit_10pct_l1, log_C5]
  - [is_hit_10pct_l1, log_C10]
  # normalized_citation_l1 ↔ raw/log citation variants
  - [normalized_citation_l1, citation_count]
  - [normalized_citation_l1, cited_by_count]
  - [normalized_citation_l1, log_citation_count]
  - [normalized_citation_l1, log_cited_by_count]
  - [normalized_citation_l1, log_C3]
  - [normalized_citation_l1, log_C5]
  - [normalized_citation_l1, log_C10]
  - [normalized_citation_l1, citation_velocity]
  # Reference age within-module pairs
  - [mean_ref_age, median_ref_age]
  - [ref_age_std, ref_age_range]
  - [pct_recent_refs_5yr, pct_old_refs_20yr]
  # Institution type: sub-indicators of num_affil_types
  - [has_industry_collab, num_affil_types]
  - [has_healthcare_collab, num_affil_types]
  # Text & presentation within-module pairs
  - [title_word_count, title_char_count]
  - [abstract_word_count, has_abstract]
  - [is_english, has_abstract]

